<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Mr. Scrooge V5</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--fg:#e6edf3;--fg2:#8b949e;
  --green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff;--cyan:#39d353;
  --border:#21262d;--pill-r:6px;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,Segoe UI,sans-serif;min-height:100vh}

/* NAV */
.nav{display:flex;align-items:center;gap:0;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:wrap;min-height:42px}
.nav-title{font-weight:700;font-size:14px;padding-right:20px;border-right:1px solid var(--border);margin-right:10px;white-space:nowrap}
.nav-title span{color:var(--green)}
.tab{padding:10px 14px;background:none;border:none;color:var(--fg2);cursor:pointer;font:13px -apple-system,Segoe UI,sans-serif;border-bottom:2px solid transparent;transition:.15s}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--fg2)}
.sess-dots{display:flex;gap:5px;align-items:center}
.sess-dot{font-size:10px;padding:2px 6px;border-radius:10px;border:1px solid var(--border);color:var(--fg2);background:var(--bg3)}
.sess-dot.on{border-color:var(--green);color:var(--green);background:#0f2e1a}

/* PANES */
.pane{display:none;padding:16px 20px;max-width:1500px;margin:0 auto}
.pane.active{display:block}

/* ACCOUNT BAR */
.acct-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:8px}
.acct-m{display:flex;flex-direction:column;min-width:90px}
.acct-m .lbl{font-size:10px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.acct-m .val{font-size:18px;font-weight:700;line-height:1.2}
.acct-m .val.pos{color:var(--green)}.acct-m .val.neg{color:var(--red)}
.acct-sep{width:1px;background:var(--border);align-self:stretch;margin:0 4px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}

/* TABLES */
table{border-collapse:collapse;width:100%;font-size:12px}
th{color:var(--fg2);font-weight:600;text-align:left;padding:5px 10px;border-bottom:2px solid var(--border)}
td{padding:5px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.03)}

/* PILLS */
.pill{display:inline-block;padding:2px 8px;border-radius:var(--pill-r);font-size:11px;font-weight:600;white-space:nowrap}
.pill-green{background:#0f2e1a;color:var(--green)}.pill-red{background:#2e0f12;color:var(--red)}
.pill-amber{background:#2e260f;color:var(--amber)}.pill-blue{background:#0d1a2e;color:var(--blue)}
.pill-gray{background:#1c2128;color:var(--fg2)}

/* DOTS */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:5px}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-amber{background:var(--amber)}.dot-gray{background:#6e7681}

/* BANNER */
.banner{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.banner-green{background:#0f2e1a;color:var(--green);border:1px solid #1a4a2a}
.banner-gray{background:#1c2128;color:var(--fg2);border:1px solid var(--border)}

/* PAIR CARDS */
.pairs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.pair-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.pair-card.bias-long{border-color:#1a4a2a}.pair-card.bias-short{border-color:#4a1a1a}.pair-card.bias-block{border-color:#4a3a10}
.pair-name{font-size:16px;font-weight:700;margin-bottom:2px}
.pair-sub{font-size:11px;color:var(--fg2);margin-bottom:8px}
.pair-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;align-items:center;font-size:12px}
.pair-lbl{color:var(--fg2);width:50px;flex-shrink:0;font-size:11px}

/* Feature chips */
.feat-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.fc{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;background:var(--bg3);border-radius:4px;font-size:11px;white-space:nowrap}
.fc .fk{color:var(--fg2)}.fc .fv{color:var(--fg);font-weight:600}
.fc.rsi-ob .fv{color:var(--red)}.fc.rsi-os .fv{color:var(--green)}.fc.spread-hi .fv{color:var(--amber)}

/* EVENTS FEED */
.event-row{padding:5px 10px;border-bottom:1px solid var(--border);font-size:11.5px;font-family:Menlo,Monaco,monospace;color:var(--fg2)}
.event-row.ev-entry{color:var(--green)}.event-row.ev-exit{color:var(--red)}.event-row.ev-ratchet{color:var(--blue)}
.event-row:last-child{border-bottom:none}

/* RATCHET STATE */
.ratchet-bar{display:flex;align-items:center;gap:8px;margin-top:4px}
.ratchet-track{flex:1;background:var(--bg3);border-radius:3px;height:6px;position:relative;overflow:visible}
.ratchet-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--amber),var(--green));transition:width .4s}
.ratchet-peak-marker{position:absolute;top:-2px;width:2px;height:10px;background:var(--cyan);border-radius:1px}
.ratchet-sl-marker{position:absolute;top:-3px;width:3px;height:12px;background:var(--red);border-radius:1px}

/* HEALTH */
.health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.health-card{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:9px 12px}
.health-name{font-weight:600;font-size:12px}.health-det{color:var(--fg2);font-size:11px;margin-top:2px}

/* SYSTEM */
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.sys-m{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 14px}
.sys-m .lbl{font-size:10px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.sys-m .val{font-size:1.35rem;font-weight:700}
.sys-m .sub{font-size:11px;color:var(--fg2);margin-top:3px}
.bar-bg{background:var(--bg3);border-radius:3px;height:5px;margin-top:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.bar-green{background:var(--green)}.bar-amber{background:var(--amber)}.bar-red{background:var(--red)}
.log-box{background:#111827;border-radius:6px;padding:10px 12px;font-family:Menlo,Monaco,monospace;font-size:11px;line-height:1.5;color:#94a3b8;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.log-err{color:var(--red)}.log-warn{color:var(--amber)}.log-ratchet{color:var(--blue)}.log-entry{color:var(--green)}.log-exit{color:var(--red)}

/* MISC */
.mono{font-family:Menlo,Monaco,monospace;font-size:11px}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--fg2)}
pre{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:Menlo,Monaco,monospace;font-size:11.5px;overflow:auto;white-space:pre-wrap}
</style></head><body>

<div class="nav">
  <div class="nav-title">SCROOGE <span>V5</span></div>
  <button class="tab active" onclick="showTab('live',this)">LIVE</button>
  <button class="tab" onclick="showTab('pairs',this)">PAIRS</button>
  <button class="tab" onclick="showTab('health',this)">HEALTH</button>
  <button class="tab" onclick="showTab('system',this)">SYSTEM</button>
  <div class="nav-right">
    <div class="sess-dots">
      <span class="sess-dot" id="sd-asia">ASI</span>
      <span class="sess-dot" id="sd-lon">LON</span>
      <span class="sess-dot" id="sd-ny">NY</span>
    </div>
    <span id="utc-clock" style="font-family:monospace;font-size:12px;color:var(--fg2)">--:-- UTC</span>
    <span style="color:var(--border)">|</span>
    <span id="ts" style="font-size:11px;color:var(--fg2)">--</span>
    <span id="spin" style="font-size:11px;opacity:.5">●</span>
  </div>
</div>

<!-- LIVE TAB -->
<div id="tab-live" class="pane active">
  <div id="banner" class="banner banner-gray">Loading...</div>
  <div id="acct-bar" class="acct-bar" style="display:none"></div>
  <div class="card">
    <div class="card-title">Open Positions</div>
    <table id="positions-tbl">
      <thead><tr>
        <th>Pair</th><th>Dir</th><th>Entry</th><th>Age</th>
        <th>SL Locked</th><th>Peak MFE</th><th>Net Now</th><th>uP&amp;L $</th>
        <th>Ratchet Level</th>
      </tr></thead>
      <tbody id="positions-body"></tbody>
    </table>
    <div id="no-positions" class="muted" style="padding:12px 10px;font-size:12px;display:none">No open positions</div>
  </div>
  <div class="card">
    <div class="card-title">Recent Events</div>
    <div id="events-feed"></div>
  </div>
</div>

<!-- PAIRS TAB -->
<div id="tab-pairs" class="pane">
  <div id="pairs-grid" class="pairs-grid"></div>
</div>

<!-- HEALTH TAB -->
<div id="tab-health" class="pane">
  <div class="card">
    <div class="card-title">Engine Status</div>
    <div id="health-engine"></div>
  </div>
  <div class="card">
    <div class="card-title">Market Data — Last Cycle</div>
    <div id="health-pairs" class="health-grid"></div>
  </div>
</div>

<!-- SYSTEM TAB -->
<div id="tab-system" class="pane">
  <div id="sys-metrics" class="sys-grid"></div>
  <div class="card">
    <div class="card-title">Services</div>
    <table id="svc-tbl">
      <thead><tr><th>Service</th><th>Status</th><th>PID</th></tr></thead>
      <tbody id="svc-body"></tbody>
    </table>
  </div>
  <div class="card">
    <div class="card-title">Journal (last 40)</div>
    <div id="log-box" class="log-box"></div>
  </div>
</div>

<script>
// ── Utilities ────────────────────────────────────────────────────────────────
function showTab(name, btn) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

function fmt(v, digits=2) {
  if (v == null) return '—';
  return Number(v).toFixed(digits);
}
function fmtPips(v) { if (v == null) return '—'; const n = Number(v); return (n >= 0 ? '+' : '') + n.toFixed(1) + 'p'; }
function fmtDollar(v) { if (v == null) return '—'; const n = Number(v); return (n >= 0 ? '+' : '') + '$' + Math.abs(n).toFixed(2); }
function colorPips(v) { if (v == null) return ''; return v >= 0 ? 'pos' : 'neg'; }
function colorDollar(v) { if (v == null) return ''; return v >= 0 ? 'pos' : 'neg'; }
function pilClass(bias) {
  return bias === 'long' ? 'pill-green' : bias === 'short' ? 'pill-red' : 'pill-amber';
}
function volClass(r) {
  return r === 'high' ? 'pill-amber' : r === 'extreme' ? 'pill-red' : r === 'low' ? 'pill-gray' : 'pill-blue';
}
function fmtAge(min) {
  if (min == null) return '—';
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// Compute ratchet level label from sl_locked_pips
function ratchetLevel(slPips) {
  if (slPips == null) return '<span class="muted">—</span>';
  const v = Number(slPips);
  if (v < 0) return `<span class="muted">SL ${fmtPips(v)}</span>`;
  return `<span class="pos">${fmtPips(v)} protected</span>`;
}

// UTC clock
function tickClock() {
  const d = new Date();
  const h = String(d.getUTCHours()).padStart(2,'0');
  const m = String(d.getUTCMinutes()).padStart(2,'0');
  const s = String(d.getUTCSeconds()).padStart(2,'0');
  document.getElementById('utc-clock').textContent = `${h}:${m}:${s} UTC`;
  // Session dots
  const utcH = d.getUTCHours();
  const asia = utcH >= 23 || utcH < 8;
  const lon  = utcH >= 7 && utcH < 16;
  const ny   = utcH >= 13 && utcH < 22;
  document.getElementById('sd-asia').classList.toggle('on', asia);
  document.getElementById('sd-lon').classList.toggle('on', lon);
  document.getElementById('sd-ny').classList.toggle('on', ny);
}
setInterval(tickClock, 1000); tickClock();

// ── State polling ─────────────────────────────────────────────────────────────
let _lastState = null;
let _spinOn = true;

async function fetchState() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    _lastState = await r.json();
    renderState(_lastState);
    _spinOn = !_spinOn;
    document.getElementById('spin').style.opacity = _spinOn ? '.5' : '.15';
  } catch(e) {
    document.getElementById('ts').textContent = 'fetch error: ' + e.message;
  }
}

async function fetchSysinfo() {
  try {
    const r = await fetch('/api/sysinfo');
    if (!r.ok) return;
    const d = await r.json();
    renderSysinfo(d);
  } catch(e) {}
}

setInterval(fetchState, 10000);
setInterval(fetchSysinfo, 30000);
fetchState();
fetchSysinfo();

// ── Render: state ─────────────────────────────────────────────────────────────
function renderState(s) {
  // Timestamp
  if (s.last_cycle_time) {
    const ago = Math.round((Date.now() - new Date(s.last_cycle_time)) / 60000);
    document.getElementById('ts').textContent = `cycle ${s.cycle_count} · ${ago < 1 ? '<1' : ago}m ago`;
  }

  // Banner
  const banner = document.getElementById('banner');
  if (s.dry_run) {
    banner.className = 'banner banner-gray';
    banner.innerHTML = '⚠ DRY RUN — signals only, no orders';
  } else {
    banner.className = 'banner banner-green';
    banner.innerHTML = `✦ V5 LIVE — 6p step-trail ratchet · 8 pairs · ${(s.open_positions||[]).length} open · cycle ${s.cycle_count}`;
  }

  // Account bar
  renderAccount(s.account);

  // Positions
  renderPositions(s.open_positions || [], s.last_views || []);

  // Events
  renderEvents(s.recent_events || []);

  // Pairs tab
  renderPairs(s.last_tickets || [], s.last_views || []);

  // Health tab
  renderHealth(s);
}

// ── Account bar ───────────────────────────────────────────────────────────────
function renderAccount(acct) {
  const bar = document.getElementById('acct-bar');
  if (!acct || !acct.nav) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const upl_c = colorDollar(acct.unrealized_pl);
  const pl_c  = colorDollar(acct.pl);
  bar.innerHTML = `
    <div class="acct-m"><div class="lbl">NAV</div><div class="val">$${Number(acct.nav).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>
    <div class="acct-sep"></div>
    <div class="acct-m"><div class="lbl">Balance</div><div class="val">$${Number(acct.balance).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>
    <div class="acct-sep"></div>
    <div class="acct-m"><div class="lbl">Open P/L</div><div class="val ${upl_c}">${fmtDollar(acct.unrealized_pl)}</div></div>
    <div class="acct-sep"></div>
    <div class="acct-m"><div class="lbl">Today P/L</div><div class="val ${pl_c}">${fmtDollar(acct.pl)}</div></div>
    <div class="acct-sep"></div>
    <div class="acct-m"><div class="lbl">Margin Used</div><div class="val">$${Number(acct.margin_used||0).toFixed(2)}</div></div>
    <div class="acct-sep"></div>
    <div class="acct-m"><div class="lbl">Open Trades</div><div class="val">${acct.open_trades||0}</div></div>
  `;
}

// ── Positions table ───────────────────────────────────────────────────────────
function renderPositions(positions, views) {
  const tbody = document.getElementById('positions-body');
  const noPos = document.getElementById('no-positions');
  if (!positions.length) {
    tbody.innerHTML = '';
    noPos.style.display = 'block';
    return;
  }
  noPos.style.display = 'none';

  const viewMap = {};
  views.forEach(v => { viewMap[v.pair] = v; });

  tbody.innerHTML = positions.map(p => {
    const dirPill = p.direction === 'long'
      ? '<span class="pill pill-green">▲ LONG</span>'
      : '<span class="pill pill-red">▼ SHORT</span>';
    const netC = colorPips(p.net_pips_now);
    const uplC = colorDollar(p.unrealized_pl);
    const slStr = p.sl_locked_pips != null
      ? `<span class="${p.sl_locked_pips >= 0 ? 'pos' : 'neg'}">${fmtPips(p.sl_locked_pips)}</span> @ ${p.sl_price}`
      : '<span class="muted">not locked</span>';

    return `<tr>
      <td><strong>${p.pair.replace('_','/')}</strong></td>
      <td>${dirPill}</td>
      <td class="mono">${p.entry}</td>
      <td>${fmtAge(p.elapsed_min)}</td>
      <td>${slStr}</td>
      <td class="pos">${fmtPips(p.peak_pips)}</td>
      <td class="${netC}">${fmtPips(p.net_pips_now)}</td>
      <td class="${uplC}">${fmtDollar(p.unrealized_pl)}</td>
      <td>${ratchetLevel(p.sl_locked_pips)}</td>
    </tr>`;
  }).join('');
}

// ── Events feed ───────────────────────────────────────────────────────────────
function renderEvents(events) {
  const feed = document.getElementById('events-feed');
  if (!events.length) {
    feed.innerHTML = '<div class="muted" style="padding:12px 10px;font-size:12px">No events yet</div>';
    return;
  }
  feed.innerHTML = events.slice().reverse().slice(0,25).map(e => {
    let cls = '';
    if (/ENTER|RECOVER|SIGNAL/i.test(e)) cls = 'ev-entry';
    else if (/EXIT|CLOSE|STOP/i.test(e)) cls = 'ev-exit';
    else if (/RATCHET|LOCK/i.test(e)) cls = 'ev-ratchet';
    return `<div class="event-row ${cls}">${e}</div>`;
  }).join('');
}

// ── Pairs grid ────────────────────────────────────────────────────────────────
function renderPairs(tickets, views) {
  const grid = document.getElementById('pairs-grid');
  if (!tickets.length) {
    grid.innerHTML = '<div class="muted" style="padding:20px;font-size:12px">No pair data yet — waiting for first cycle</div>';
    return;
  }

  const viewMap = {};
  views.forEach(v => { viewMap[v.pair] = v; });

  // Group by pair (take best session or most recent)
  const byPair = {};
  tickets.forEach(t => {
    if (!byPair[t.pair] || t.timestamp > byPair[t.pair].timestamp) byPair[t.pair] = t;
  });

  grid.innerHTML = Object.values(byPair).sort((a,b) => b.composite - a.composite).map(t => {
    const v = viewMap[t.pair] || {};
    const biasClass = `bias-${t.dir_bias}`;
    const dirPill = t.dir_bias === 'long'
      ? '<span class="pill pill-green">▲ LONG</span>'
      : t.dir_bias === 'short'
      ? '<span class="pill pill-red">▼ SHORT</span>'
      : '<span class="pill pill-amber">■ BLOCK</span>';
    const volPill = `<span class="pill ${volClass(t.vol_regime)}">${t.vol_regime.toUpperCase()}</span>`;
    const actionPill = t.actionable
      ? '<span class="pill pill-green">ACTIVE</span>'
      : '<span class="pill pill-gray">FILTERED</span>';

    // Score bar
    const scoreW = Math.round(Math.abs(t.dir_score) * 100);
    const scoreColor = t.dir_score > 0 ? 'var(--green)' : 'var(--red)';

    // Feature chips
    const rsiClass = v.rsi14 > 70 ? 'rsi-ob' : v.rsi14 < 30 ? 'rsi-os' : '';
    const spreadClass = v.spread_pips > 2 ? 'spread-hi' : '';
    const chips = [
      v.rsi14 != null ? `<span class="fc ${rsiClass}"><span class="fk">RSI</span><span class="fv">${fmt(v.rsi14,1)}</span></span>` : '',
      v.rsi_slope != null ? `<span class="fc"><span class="fk">RSI△</span><span class="fv">${v.rsi_slope>=0?'+':''}${fmt(v.rsi_slope,2)}</span></span>` : '',
      v.h1_ret_1bar != null ? `<span class="fc"><span class="fk">H1ret</span><span class="fv">${fmtPips(v.h1_ret_1bar)}</span></span>` : '',
      v.h1_ret_4bar != null ? `<span class="fc"><span class="fk">4H</span><span class="fv">${fmtPips(v.h1_ret_4bar)}</span></span>` : '',
      v.adr_consumed != null ? `<span class="fc"><span class="fk">ADR</span><span class="fv">${Math.round(v.adr_consumed*100)}%</span></span>` : '',
      v.spread_pips != null ? `<span class="fc ${spreadClass}"><span class="fk">spd</span><span class="fv">${fmt(v.spread_pips,1)}p</span></span>` : '',
      v.htf_pct_20 != null ? `<span class="fc"><span class="fk">H20</span><span class="fv">${fmt(v.htf_pct_20,3)}</span></span>` : '',
    ].filter(Boolean).join('');

    return `<div class="pair-card ${biasClass}">
      <div class="pair-name">${t.pair.replace('_','/')}</div>
      <div class="pair-sub">${t.session.toUpperCase()} session · ${actionPill}</div>
      <div class="pair-row">
        <span class="pair-lbl">Direction</span>
        ${dirPill}
        <span style="font-size:11px;color:var(--fg2)">score ${t.dir_score >= 0 ? '+' : ''}${fmt(t.dir_score,3)}</span>
      </div>
      <div style="margin:5px 0 2px;background:var(--bg3);border-radius:3px;height:4px;overflow:hidden">
        <div style="width:${scoreW}%;height:100%;background:${scoreColor};border-radius:3px"></div>
      </div>
      <div class="pair-row">
        <span class="pair-lbl">Certainty</span>
        <span>${Math.round(t.dir_certainty*100)}% dir · ${Math.round(t.mom_certainty*100)}% mom</span>
      </div>
      <div class="pair-row">
        <span class="pair-lbl">Vol</span>
        ${volPill}
        <span style="font-size:11px;color:var(--fg2)">~${fmt(t.expected_pips,1)}p expected</span>
      </div>
      ${chips ? `<div class="feat-row">${chips}</div>` : ''}
    </div>`;
  }).join('');
}

// ── Health tab ────────────────────────────────────────────────────────────────
function renderHealth(s) {
  const eng = document.getElementById('health-engine');
  const ago = s.last_cycle_time ? Math.round((Date.now() - new Date(s.last_cycle_time))/60000) : null;
  eng.innerHTML = `<table>
    <tr><td width="160">Mode</td><td>${s.dry_run ? '<span class="pill pill-amber">DRY RUN</span>' : '<span class="pill pill-green">LIVE</span>'}</td></tr>
    <tr><td>Cycle count</td><td>${s.cycle_count}</td></tr>
    <tr><td>Last cycle</td><td>${s.last_cycle_time ? new Date(s.last_cycle_time).toISOString().replace('T',' ').slice(0,19) + ' UTC (' + (ago < 1 ? '<1' : ago) + 'm ago)' : '—'}</td></tr>
    <tr><td>Open positions</td><td>${(s.open_positions||[]).length}</td></tr>
    <tr><td>Pairs stamped</td><td>${(s.last_tickets||[]).length}</td></tr>
    <tr><td>Server time</td><td>${s.server_time ? new Date(s.server_time).toISOString().replace('T',' ').slice(0,19) + ' UTC' : '—'}</td></tr>
  </table>`;

  // Per-pair health
  const pairs = document.getElementById('health-pairs');
  if (!(s.last_tickets||[]).length) {
    pairs.innerHTML = '<div class="muted" style="padding:12px;font-size:12px">No cycle data yet</div>';
    return;
  }
  const viewMap = {};
  (s.last_views||[]).forEach(v => { viewMap[v.pair] = v; });
  pairs.innerHTML = (s.last_tickets||[]).map(t => {
    const v = viewMap[t.pair] || {};
    const bidStr = v.bid != null ? `bid ${v.bid} / ask ${v.ask}` : '—';
    return `<div class="health-card">
      <div class="health-name">${t.pair.replace('_','/')} <span class="muted" style="font-weight:400">${t.session}</span></div>
      <div class="health-det">${bidStr}</div>
      <div class="health-det">${t.dir_bias.toUpperCase()} ${fmtPips(t.dir_score*10)} · ${t.vol_regime}</div>
    </div>`;
  }).join('');
}

// ── Sysinfo (SYSTEM tab) ──────────────────────────────────────────────────────
function renderSysinfo(d) {
  const sys = d.system || {};
  const metrics = document.getElementById('sys-metrics');
  function barColor(pct) { return pct > 80 ? 'bar-red' : pct > 60 ? 'bar-amber' : 'bar-green'; }
  metrics.innerHTML = [
    {lbl:'CPU', val:`${sys.cpu_pct||0}%`, sub:`load ${sys.load_1||0} · ${sys.cpu_count||0} cores`, pct:sys.cpu_pct||0},
    {lbl:'RAM', val:`${sys.ram_pct||0}%`, sub:`${sys.ram_used_gb||0} / ${sys.ram_total_gb||0} GB`, pct:sys.ram_pct||0},
    {lbl:'Disk', val:`${sys.disk_pct||0}%`, sub:`${sys.disk_used_gb||0} / ${sys.disk_total_gb||0} GB`, pct:sys.disk_pct||0},
    {lbl:'Uptime', val:sys.uptime||'—', sub:sys.hostname||'—', pct:0},
  ].map(m => `<div class="sys-m">
    <div class="lbl">${m.lbl}</div>
    <div class="val">${m.val}</div>
    <div class="sub">${m.sub}</div>
    ${m.pct ? `<div class="bar-bg"><div class="bar-fill ${barColor(m.pct)}" style="width:${m.pct}%"></div></div>` : ''}
  </div>`).join('');

  // Services table
  const svcs = document.getElementById('svc-body');
  svcs.innerHTML = (d.services||[]).map(s => {
    const ok = s.active === 'active';
    const dot = ok ? 'dot-green' : s.active === 'failed' ? 'dot-red' : 'dot-amber';
    return `<tr>
      <td><span class="dot ${dot}"></span>${s.name}</td>
      <td><span class="pill ${ok ? 'pill-green' : 'pill-red'}">${s.active}/${s.sub}</span></td>
      <td class="mono muted">${s.pid||'—'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="3" class="muted">No services found</td></tr>';

  // Log
  const logBox = document.getElementById('log-box');
  logBox.innerHTML = (d.logs||[]).map(l => {
    let cls = '';
    if (/ERROR|CRITICAL/i.test(l)) cls = 'log-err';
    else if (/WARN/i.test(l)) cls = 'log-warn';
    else if (/RATCHET|LOCK/i.test(l)) cls = 'log-ratchet';
    else if (/ENTER|RECOVER|PLACED/i.test(l)) cls = 'log-entry';
    else if (/EXIT|CLOSE|STOP/i.test(l)) cls = 'log-exit';
    return `<span class="${cls}">${l.replace(/</g,'&lt;')}</span>\n`;
  }).join('');
  logBox.scrollTop = logBox.scrollHeight;
}
</script>
</body></html>
